name: Build and Push Docker Images

on:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Login Docker Hub
          run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

        - name: Build Frontend
          run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend

        - name: Build Product Service
          run: docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service:latest ./product-service

        - name: Build Cart Service
          run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cart-service:latest ./cart-service

        - name: Push Frontend
          run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest

        - name: Push Product Service
          run: docker push ${{ secrets.DOCKER_USERNAME }}/product-service:latest

        - name: Push Cart Service
          run: docker push ${{ secrets.DOCKER_USERNAME }}/cart-service:latest
