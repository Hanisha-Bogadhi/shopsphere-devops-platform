name: Build Push Deploy

on:
  push:
    branches:
    - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Login Docker Hub
      run: |
        echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
        -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Frontend
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend

    - name: Build Product Service
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service:latest ./product-service

    - name: Build Cart Service
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cart-service:latest ./cart-service

    - name: Push Images
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/product-service:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/cart-service:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/shopsphere
            docker compose pull
            docker compose up -d
