<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSphere</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <header>

        <div class="logo">
            ShopSphere
        </div>

        <nav>

            <a class="nav-btn" href="/">
                Home
            </a>

            <a class="nav-btn" href="/products">
                🛍 Products
            </a>

            <a class="nav-btn" href="/cart">
                🛒 Cart
            </a>

        </nav>

    </header>

    <!-- HERO SECTION -->

    <section class="hero">

        <div class="hero-overlay">

            <p class="sale-text">
                SUMMER COLLECTION 2026
            </p>

            <h1>
                Get Up To 30% Off <br>
                New Arrivals
            </h1>

            <p class="hero-description">

                Explore premium fashion collections,
                accessories and trending products.

            </p>

            <button onclick="window.location.href='/products'">
                SHOP NOW
            </button>

        </div>

    </section>

    <!-- CATEGORY SECTION -->

    <section class="categories">

        <div class="category-card">

            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1000&q=80">

            <div class="overlay">
                Women's
            </div>

        </div>

        <div class="category-card">

            <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=1000&q=80">

            <div class="overlay">
                Accessories
            </div>

        </div>

        <div class="category-card">

            <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1000&q=80">

            <div class="overlay">
                Men's
            </div>

        </div>

    </section>

    <!-- PRODUCTS SECTION -->

    <section class="products-section">

        <h2>
            New Arrivals
        </h2>

        <div class="underline"></div>

        <div class="products-grid">

            <div class="product-card">

                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1000&q=80">

                <h3>Nike Running Shoes</h3>

                <p>$120</p>

                <button onclick="window.location.href='/cart'">

                    Add To Cart

                </button>

            </div>

            <div class="product-card">

                <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=1000&q=80">

                <h3>Casual Hoodie</h3>

                <p>$80</p>

                <button onclick="window.location.href='/cart'">

                    Add To Cart

                </button>

            </div>

            <div class="product-card">

                <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1000&q=80">

                <h3>Women's Jacket</h3>

                <p>$150</p>

                <button onclick="window.location.href='/cart'">

                    Add To Cart

                </button>

            </div>

        </div>

    </section>

</body>

</html>
