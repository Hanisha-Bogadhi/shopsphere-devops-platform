version: '3'

services:

  frontend:
    build: ./frontend
    container_name: frontend

  product-service:
    build: ./product-service
    container_name: product-service

  cart-service:
    build: ./cart-service
    container_name: cart-service

  nginx:
    image: nginx:alpine
    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx:/etc/nginx

    depends_on:
      - frontend
      - product-service
      - cart-service

  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring:/etc/prometheus

  grafana:
    image: grafana/grafana
    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus