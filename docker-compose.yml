services:

  frontend:
    build: ./frontend
    ports:
      - "3001:80"

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "5000:5000"

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5001:5001"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
    - ./nginx:/etc/nginx/conf.d
    depends_on:
      - frontend
      - cart-service
      - product-service

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
    - monitoring

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
    - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest

    ports:
      - "8081:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    networks:
    - monitoring

networks:
  monitoring: